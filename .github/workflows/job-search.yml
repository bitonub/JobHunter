name: Remote Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: remote-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      - name: Create temporary profile
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROFILE_JSON:-}" ]]; then
            echo "PROFILE_JSON secret is required" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$PROFILE_JSON" > data/profile.json

      - name: Run JobHunter
        run: |
          python -m jobhunter_ai.cli run \
            --profile data/profile.json \
            --sources data/sources.remote.json \
            --preferences data/preferences.json \
            --output output

      - name: Send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are required" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import sys
          import subprocess
          import tempfile
          from pathlib import Path


          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          api_url = f"https://api.telegram.org/bot{token}"
          report = json.loads(Path("output/alerts.json").read_text(encoding="utf-8"))


          def safe_error_message(response_path: Path) -> str:
              try:
                  payload = json.loads(response_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return "Telegram returned a non-JSON error response"
              if payload.get("ok") is True:
                  return ""
              description = payload.get("description")
              if not isinstance(description, str) or not description.strip():
                  return "Telegram returned an error without a description"
              description = " ".join(description.split())
              return description.replace(token, "[redacted]")[:300]


          def telegram_request(arguments: list[str]) -> None:
              with tempfile.TemporaryDirectory() as temporary_directory:
                  response_path = Path(temporary_directory) / "telegram-response.json"
                  try:
                      result = subprocess.run(
                          [
                              "curl",
                              "--silent",
                              "--show-error",
                              "--output",
                              str(response_path),
                              "--write-out",
                              "%{http_code}",
                              *arguments,
                          ],
                          check=False,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                      )
                  except OSError:
                      raise RuntimeError("Telegram request failed: HTTP 000; curl transport error") from None

                  http_code = result.stdout.strip() or "000"
                  try:
                      status_code = int(http_code)
                  except ValueError:
                      status_code = 0
                  error_message = safe_error_message(response_path)
                  if result.returncode != 0 or not 200 <= status_code < 300 or error_message:
                      if not error_message:
                          error_message = "curl transport error" if status_code == 0 else "HTTP error"
                      print(
                          f"Telegram request failed: HTTP {http_code}; {error_message}",
                          file=sys.stderr,
                      )
                      raise SystemExit(1)


          for alert in report.get("alerts", []):
              analysis = alert.get("analysis", {})
              if not analysis.get("compatible"):
                  continue
              cv_path = alert.get("tailored_cv_path")
              if not cv_path or not Path(cv_path).is_file():
                  continue

              job = alert["job"]
              matched = [
                  *analysis.get("matched_required", []),
                  *analysis.get("matched_preferred", []),
              ]
              missing = [
                  *analysis.get("missing_required", []),
                  *analysis.get("missing_preferred", []),
              ]
              message = "\n".join(
                  [
                      f"{job.get('title', 'Sin título')} — {job.get('company', 'Empresa no especificada')}",
                      f"Compatibilidad: {analysis.get('score', 0):.2f}%",
                      f"Requisitos cumplidos: {', '.join(matched) or 'ninguno'}",
                      f"Requisitos faltantes: {', '.join(missing) or 'ninguno'}",
                      f"Enlace: {job.get('url') or 'No disponible'}",
                  ]
              )
              telegram_request(
                  [
                      "-X",
                      "POST",
                      f"{api_url}/sendMessage",
                      "--data-urlencode",
                      f"chat_id={chat_id}",
                      "--data-urlencode",
                      f"text={message}",
                  ]
              )
              telegram_request(
                  [
                      "-X",
                      "POST",
                      f"{api_url}/sendDocument",
                      "-F",
                      f"chat_id={chat_id}",
                      "-F",
                      f"document=@{cv_path};type=text/markdown",
                  ]
              )
          PY

      - name: Remove private temporary files
        if: always()
        shell: bash
        run: |
          rm -f -- data/profile.json
          rm -rf -- output
