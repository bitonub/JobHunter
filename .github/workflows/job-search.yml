name: Remote Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: remote-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      - name: Create temporary profile
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROFILE_JSON:-}" ]]; then
            echo "PROFILE_JSON secret is required" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$PROFILE_JSON" > data/profile.json

      - name: Run JobHunter
        run: |
          python -m jobhunter_ai.cli run \
            --profile data/profile.json \
            --sources data/sources.example.json \
            --preferences data/preferences.json \
            --output output

      - name: Send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are required" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path


          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          api_url = f"https://api.telegram.org/bot{token}"
          report = json.loads(Path("output/alerts.json").read_text(encoding="utf-8"))


          def telegram_request(arguments: list[str]) -> None:
              try:
                  subprocess.run(
                      ["curl", "--fail", "--silent", "--show-error", *arguments],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError as error:
                  raise RuntimeError("Telegram API request failed") from error


          for alert in report.get("alerts", []):
              analysis = alert.get("analysis", {})
              if not analysis.get("compatible"):
                  continue
              cv_path = alert.get("tailored_cv_path")
              if not cv_path or not Path(cv_path).is_file():
                  continue

              job = alert["job"]
              matched = [
                  *analysis.get("matched_required", []),
                  *analysis.get("matched_preferred", []),
              ]
              missing = [
                  *analysis.get("missing_required", []),
                  *analysis.get("missing_preferred", []),
              ]
              message = "\n".join(
                  [
                      f"{job.get('title', 'Sin título')} — {job.get('company', 'Empresa no especificada')}",
                      f"Compatibilidad: {analysis.get('score', 0):.2f}%",
                      f"Requisitos cumplidos: {', '.join(matched) or 'ninguno'}",
                      f"Requisitos faltantes: {', '.join(missing) or 'ninguno'}",
                      f"Enlace: {job.get('url') or 'No disponible'}",
                  ]
              )
              telegram_request(
                  [
                      "-X",
                      "POST",
                      f"{api_url}/sendMessage",
                      "--data-urlencode",
                      f"chat_id={chat_id}",
                      "--data-urlencode",
                      f"text={message}",
                  ]
              )
              telegram_request(
                  [
                      "-X",
                      "POST",
                      f"{api_url}/sendDocument",
                      "-F",
                      f"chat_id={chat_id}",
                      "-F",
                      f"document=@{cv_path};type=text/markdown",
                  ]
              )
          PY

      - name: Remove private temporary files
        if: always()
        shell: bash
        run: |
          rm -f -- data/profile.json
          rm -rf -- output
