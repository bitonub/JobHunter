[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter-ai"
version = "0.1.0"
description = "Transparent job matching and ATS-friendly CV tailoring MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
jobhunter = "jobhunter_ai.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunter_ai*"]
